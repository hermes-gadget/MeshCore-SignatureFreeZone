name: Build Unified Firmware for MeshCore Release

on:
  push:
    tags:
      - 'Unified-Open-v*'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: MeshCore companion tag or commit (blank selects latest companion tag)
        required: false
        type: string
      publish_release:
        description: Create a draft GitHub release after every target builds
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [meshcore-companion-release]
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: unified-upstream-${{ inputs.upstream_ref || github.event.client_payload.ref || github.ref_name || 'latest' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: meshcore-dev/MeshCore
  PIP_BREAK_SYSTEM_PACKAGES: '1'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      upstream_ref: ${{ steps.version.outputs.upstream_ref }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      already_built: ${{ steps.version.outputs.already_built }}
      matrix: ${{ steps.targets.outputs.matrix || '{"include":[{"target":"skip","platform":"unknown"}]}' }}
    steps:
      - name: Check out unified implementation
        uses: actions/checkout@v6

      - id: version
        name: Resolve upstream companion release
        env:
          REQUESTED_REF: ${{ inputs.upstream_ref || github.event.client_payload.ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ref="$REQUESTED_REF"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            ref="companion-${GITHUB_REF_NAME#Unified-Open-}"
          fi
          if [ -z "$ref" ]; then
            ref=$(git ls-remote --tags --refs \
              "https://github.com/${UPSTREAM_REPOSITORY}.git" 'companion-v*' \
              | awk -F/ '{print $3}' | sort -V | tail -n 1)
          fi
          if [ -z "$ref" ]; then
            echo "No upstream companion release tag was found" >&2
            exit 1
          fi
          version=${ref#companion-}
          release_tag="Unified-Open-${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>&1; then
            already_built=true
          else
            already_built=false
          fi
          echo "upstream_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "already_built=$already_built" >> "$GITHUB_OUTPUT"

      - name: Check out upstream release
        if: steps.version.outputs.already_built != 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ steps.version.outputs.upstream_ref }}
          path: upstream

      - name: Overlay unified implementation
        if: steps.version.outputs.already_built != 'true'
        run: python3 tools/apply_unified_overlay.py upstream

      - uses: ./.github/actions/setup-build-environment
        if: steps.version.outputs.already_built != 'true'

      - name: Verify overlay against upstream interface contracts
        if: steps.version.outputs.already_built != 'true'
        shell: bash
        run: |
          python3 -m unittest discover -s test/unified -p 'test_*.py' -v
          mkdir -p .pio
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I test/unified -I examples/unified_radio -I upstream/src \
            test/unified/test_transport_manager.cpp \
            examples/unified_radio/UnifiedTransportManager.cpp \
            -o .pio/test-transport-manager
          .pio/test-transport-manager

      - id: targets
        name: Discover every upstream companion device
        if: steps.version.outputs.already_built != 'true'
        working-directory: upstream
        shell: bash
        run: |
          python3 tools/generate_unified_builds.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          targets = json.load(open('.pio/unified-targets.json', encoding='utf-8'))
          print('matrix=' + json.dumps({'include': targets}, separators=(',', ':')))
          PY
      - name: Upload release target manifest
        if: steps.version.outputs.already_built != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unified-release-manifest-${{ steps.version.outputs.version }}
          path: upstream/.pio/unified-targets.json

  build:
    needs: discover
    if: needs.discover.outputs.already_built != 'true'
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out unified implementation
        uses: actions/checkout@v6
      - name: Check out upstream release
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ needs.discover.outputs.upstream_ref }}
          path: upstream
      - name: Overlay unified implementation
        run: python3 tools/apply_unified_overlay.py upstream
      - uses: ./.github/actions/setup-build-environment
      - name: Generate build environment
        working-directory: upstream
        run: python3 tools/generate_unified_builds.py
      - id: compile
        name: Compile firmware and classify upstream failures
        working-directory: upstream
        env:
          PLATFORMIO_BUILD_FLAGS: >-
            -DFIRMWARE_VERSION='"${{ needs.discover.outputs.version }}"'
        shell: bash
        run: |
          build_date=$(date '+%d-%b-%Y')
          export PLATFORMIO_BUILD_FLAGS="${PLATFORMIO_BUILD_FLAGS} -DFIRMWARE_BUILD_DATE='\"${build_date}\"'"
          python3 tools/validate_unified_builds.py \
            --target "${{ matrix.target }}" --verbose --github-output
      - name: Create ESP32 merged image
        if: steps.compile.outputs.skipped != 'true' && matrix.platform == 'esp32'
        working-directory: upstream
        run: pio run -c .pio/unified-platformio.ini -e "${{ matrix.target }}" -t mergebin
      - name: Create nRF52 UF2 image
        if: steps.compile.outputs.skipped != 'true' && matrix.platform == 'nrf52'
        working-directory: upstream
        shell: bash
        run: |
          python3 bin/uf2conv/uf2conv.py \
            ".pio/build/${{ matrix.target }}/firmware.hex" -c \
            -o ".pio/build/${{ matrix.target }}/firmware.uf2" -f 0xADA52840
      - name: Collect firmware files
        if: steps.compile.outputs.skipped != 'true'
        working-directory: upstream
        shell: bash
        run: |
          mkdir -p release
          for file in ".pio/build/${{ matrix.target }}"/firmware.{bin,hex,uf2,zip}; do
            if [ -f "$file" ]; then
              extension=${file##*.}
              cp "$file" "release/${{ matrix.target }}-${{ needs.discover.outputs.version }}.${extension}"
            fi
          done
          if [ -f ".pio/build/${{ matrix.target }}/firmware-merged.bin" ]; then
            cp ".pio/build/${{ matrix.target }}/firmware-merged.bin" \
              "release/${{ matrix.target }}-${{ needs.discover.outputs.version }}-merged.bin"
          fi
          test -n "$(find release -type f -print -quit)"
      - uses: actions/upload-artifact@v7
        if: steps.compile.outputs.skipped != 'true'
        with:
          name: firmware-${{ matrix.target }}
          path: upstream/release/*
          if-no-files-found: error

  release:
    needs: [discover, build]
    if: >-
      needs.discover.outputs.already_built != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
      RELEASE_NAME: Unified Companion Firmware ${{ needs.discover.outputs.version }}
      TARGET_COMMITISH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: release
          merge-multiple: true

      # Create the draft release once, retrying on secondary rate limits. A
      # missing GitHub release/tag is the primary failure mode we are fixing,
      # so unlike the previous single action call this is idempotent: if the
      # release already exists (e.g. a re-run after a partial upload) it is
      # reused rather than failing the job.
      - name: Create draft unified release
        shell: bash
        run: |
          set -euo pipefail
          release_json=""
          backoff=5
          for attempt in 1 2 3 4 5; do
            if release_json=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                 -f tag_name="${RELEASE_TAG}" \
                 -f target_commitish="${TARGET_COMMITISH}" \
                 -f name="${RELEASE_NAME}" \
                 -F draft=true \
                 -F generate_release_notes=true 2>/tmp/release-create.err); then
              break
            fi
            if grep -qiE 'secondary rate limit|rate limit|HTTP 403|HTTP 429' /tmp/release-create.err; then
              echo "Create hit a rate limit (attempt ${attempt}); backing off ${backoff}s" >&2
              sleep "$backoff"
              backoff=$(( backoff * 2 ))
              continue
            fi
            # Most likely the draft release already exists from an earlier attempt.
            if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/tmp/release-create.err); then
              echo "Reusing existing release ${RELEASE_TAG}"
              break
            fi
            echo "Unable to create or find release ${RELEASE_TAG}" >&2
            cat /tmp/release-create.err >&2 || true
            exit 1
          done
          if [ -z "${release_json}" ]; then
            echo "Release creation for ${RELEASE_TAG} did not succeed after retries" >&2
            exit 1
          fi
          release_id=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          upload_url=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
          {
            echo "release_id=${release_id}"
            echo "upload_url=${upload_url}"
          } >> "$GITHUB_ENV"
          echo "Draft release ${RELEASE_TAG} ready (id ${release_id})"

      # `files: release/*` used to make action-gh-release fire one API request
      # per file in a single burst, which tripped GitHub's secondary rate limit
      # (HTTP 403 / 429) partway through and failed the whole job. Upload the
      # assets ourselves instead, with exponential backoff on rate-limit
      # responses and a short pause between batches, so a transient limit only
      # delays uploads instead of failing the release.
      - name: Upload firmware assets with retry and backoff
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*)
          total=${#files[@]}
          if [ "$total" -eq 0 ]; then
            echo "No firmware assets were found under release/" >&2
            exit 1
          fi
          echo "Uploading ${total} firmware assets to ${RELEASE_TAG}"

          upload_one() {
            local file="$1" name="$2" attempt=1 max=6 backoff=5 code resp
            while :; do
              resp="/tmp/upload-$$.json"
              code=$(curl -sS -o "$resp" -w '%{http_code}' \
                -X POST "${upload_url}?name=${name}" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@${file}") || code="000"
              if [ "$code" = "201" ] || [ "$code" = "200" ]; then
                return 0
              fi
              # Idempotent re-run: the asset is already attached to this release.
              if [ "$code" = "422" ] && grep -qi 'already_exists' "$resp"; then
                return 0
              fi
              local retryable=false
              case "$code" in
                429) retryable=true ;;
                403) grep -qiE 'secondary rate limit|rate limit' "$resp" && retryable=true ;;
                000|5??) retryable=true ;;
              esac
              if [ "$retryable" = true ] && [ "$attempt" -lt "$max" ]; then
                echo "  retrying ${name} (attempt ${attempt}/${max}, HTTP ${code}); sleeping ${backoff}s" >&2
                sleep "$backoff"
                backoff=$(( backoff * 2 ))
                attempt=$(( attempt + 1 ))
                continue
              fi
              echo "Upload failed for ${name} (HTTP ${code})" >&2
              cat "$resp" >&2 || true
              return 1
            done
          }

          batch_size=25
          pause_between_batches=3
          uploaded=0
          for file in "${files[@]}"; do
            upload_one "$file" "$(basename "$file")"
            uploaded=$(( uploaded + 1 ))
            if (( uploaded % batch_size == 0 )); then
              echo "Uploaded ${uploaded}/${total}; pausing ${pause_between_batches}s to stay under the rate limit"
              sleep "$pause_between_batches"
            fi
          done
          echo "Uploaded all ${uploaded}/${total} firmware assets to ${RELEASE_TAG}"
